<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <filter id="xShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0.6" stdDeviation="0.4" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="1" dy="3" stdDeviation="1.8" flood-color="#000" flood-opacity="0.55"/>
      <feDropShadow dx="2" dy="5" stdDeviation="3.5" flood-color="#0a1024" flood-opacity="0.5"/>
    </filter>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.7" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="xGrad" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#eef3ff"/>
      <stop offset="100%" stop-color="#9aa8c8"/>
    </linearGradient>
    <clipPath id="bigBarClip">
      <polygon points="28,8 36,8 12,32 4,32"/>
    </clipPath>
  </defs>

  <g filter="url(#xShadow)">
    <polygon points="12,8 13.5,10 18.5,15 17,13" fill="#3a4870"/>
    <polygon points="27,23 28.5,25 37.5,34 36,32" fill="#3a4870"/>
    <polygon points="36,8 37.5,10 13.5,34 12,32" fill="#3a4870"/>
    <polygon points="17,13 13,17 14.5,19 18.5,15" fill="#1c243d"/>
    <polygon points="28,32 36,32 37.5,34 29.5,34" fill="#1c243d"/>
    <polygon points="4,32 12,32 13.5,34 5.5,34" fill="#1c243d"/>
    <polygon points="4,8 12,8 17,13 13,17" fill="url(#xGrad)"/>
    <polygon points="36,32 28,32 23,27 27,23" fill="url(#xGrad)"/>
    <polygon points="28,8 36,8 12,32 4,32" fill="url(#xGrad)"/>
  </g>

  <polygon points="22.3,13.7 26.3,17.7 17.7,26.3 13.7,22.3" fill="#3b82f6"/>

  <text x="7" y="20" text-anchor="middle" dominant-baseline="central"
    font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="800"
    fill="#ffffff" filter="url(#textShadow)">x</text>
  <text x="33" y="20" text-anchor="middle" dominant-baseline="central"
    font-family="'Space Grotesk',system-ui,sans-serif" font-size="11" font-weight="800"
    fill="#ffffff" filter="url(#textShadow)">s</text>
</svg>
